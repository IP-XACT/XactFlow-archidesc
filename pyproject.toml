[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xactflow-archidesc"
dynamic = ["version"]
description = "XactFlow importer plugin that serializes an architecture description into an ipxact.Design."
readme = "README.md"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Maxime Travaillard"},
]
requires-python = ">=3.9"
dependencies = [
    "xactflow",
    "ipxact-compiler",
]
keywords = [
    "IP-XACT", "IEEE 1685", "XML", "Compiler",
    "XactFlow", "Architecture", "Design", "Importer",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/IP-XACT/XactFlow-archidesc"
Issues = "https://github.com/IP-XACT/XactFlow-archidesc/issues"

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.entry-points."xactflow.importers"]
archidesc = "xactflow_archidesc:ArchiDescImporter"

[tool.setuptools.dynamic]
version = {attr = "xactflow_archidesc.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xactflow_archidesc = ["py.typed"]
